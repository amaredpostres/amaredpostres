<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AMARED · Costos</title>

  <!-- ✅ favicon igual al resto -->
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">

  <!-- ✅ estilos globales AMARED -->
  <link rel="stylesheet" href="styles.css" />

  <!-- ✅ estilos SOLO de costos -->
  <link rel="stylesheet" href="costs.css" />
</head>

<body class="costsPage">
  <div class="page">
    <header class="topbar">
      <div class="topbarInner">
        <div class="brand">
          <img class="brandLogo" src="assets/Logo-Amared.svg" alt="AMARED Postres" />
        </div>
      </div>
    </header>

    <main class="container">
      <!-- Unlock -->
      <section class="card">
        <h2 class="cardTitle">🔒 Costos de ingredientes</h2>
        <p class="cardSubtitle">
          Ingresa la clave de costos para ver y editar ingredientes. Esta clave se valida en el servidor.
        </p>

        <div class="costsRow">
          <input id="secret" class="costsField" type="password" placeholder="COSTS_SECRET" autocomplete="off" />
          <button id="unlock" class="btn">Desbloquear</button>
        </div>

        <div id="err" class="costsErr"></div>
      </section>

      <!-- Editor -->
      <section id="editor" class="card" style="display:none;">
        <div class="costsHeaderRow">
          <div>
            <h2 class="cardTitle">📌 Tabla de costos</h2>
            <p class="cardSubtitle">
              El cálculo se actualiza en tiempo real. Usa <b>Guardar</b> para dejarlo permanente en la base de datos.
            </p>
          </div>

          <div class="costsActions">
            <button id="saveAll" class="btn">Guardar</button>
          </div>
        </div>

        
        <div class="costsNav">
          <a class="btn secondary" href="purchases.html">🛒 Ir a Compras</a>
        </div>

        <div id="topTools" class="costsTopTools"></div>
        <div id="list" class="costsList"></div>
</section>
    
  <div id="netDebug" class="netDebug" style="display:none;"></div>
</main>

    <!-- Loading -->
    <div id="loading" class="costsLoading">
      <div class="costsLoadingCard">
        <div class="costsLoadingSpinner" aria-hidden="true"></div>
        <div class="costsLoadingTitle" id="lt">Cargando…</div>
        <div class="costsLoadingDesc" id="ld">Por favor espera.</div>
      </div>
    </div>

    <!-- ✅ SECCIONES CANÓNICAS -->
    <script src="kitchen-costs.js?v=base1"></script>

    <!-- ✅ LÓGICA COSTOS -->
    <script src="costs.js?v=base1"></script>
  </div>
</body>
</html>
