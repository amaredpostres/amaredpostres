<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AMARED · Costos de ingredientes</title>

  <!-- ✅ CSS GLOBAL AMARED (el mismo de todas las páginas) -->
  <link rel="stylesheet" href="./styles.css" />

  <!-- ✅ Solo ajustes puntuales para costos (acordeones/modales) -->
  <link rel="stylesheet" href="./costs.css" />

  <link rel="icon" href="./favicon.ico" />
</head>

<body>
  <!-- Usa la misma topbar del sitio -->
  <header class="topbar">
    <div class="topbarInner">
      <div class="brand">
        <!-- Aquí puedes poner tu logo si ya lo haces en otras páginas -->
        <img src="./assets/logo.svg" alt="AMARED" style="height:44px; width:auto;" onerror="this.style.display='none'">
      </div>
    </div>
  </header>

  <main class="wrapCosts">
    <section class="card">
      <h2 class="hTitle">🔒 Costos de ingredientes</h2>
      <p class="pSub">
        Ingresa la clave de costos para ver y editar los ingredientes. Esta clave se valida en el servidor.
      </p>

      <div class="rowFlex">
        <input id="secret" class="field" type="password" placeholder="COSTS_SECRET" autocomplete="off" />
        <button id="unlock" class="btn">Desbloquear</button>
      </div>

      <div id="err" class="errText"></div>
    </section>

    <section id="editor" class="card" style="display:none;">
      <div class="rowFlex spaceBetween">
        <div>
          <h2 class="hTitle">📌 Tabla de costos</h2>
          <p class="pSub">
            El cálculo se actualiza en tiempo real. Usa <b>Guardar en Sheets</b> para dejarlo permanente.
          </p>
        </div>

        <div class="rowFlex">
          <button id="saveAll" class="btn">Guardar en Sheets</button>
        </div>
      </div>

      <!-- costs.js dibuja aquí Refrescar + Tiendas/Marcas -->
      <div id="topTools" class="mt12"></div>

      <!-- costs.js dibuja aquí los acordeones -->
      <div id="list" class="mt12"></div>
    </section>
  </main>

  <!-- Loading overlay -->
  <div id="loading" class="loadingOverlay">
    <div class="loadingCard">
      <div class="loadingTitle" id="lt">Cargando…</div>
      <div class="loadingDesc" id="ld">Por favor espera.</div>
    </div>
  </div>

  <!-- Ingredientes/grupos canónicos -->
  <script src="./kitchen-costs.js"></script>

  <!-- Lógica de costos (tu costs.v5.js renombrado a costs.js) -->
  <script src="./costs.js"></script>
</body>
</html>
