<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AMARED · Gestión de perfiles</title>

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" />

  <!-- Reusa tu CSS general si ya lo usas en otras páginas -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="logo.svg" alt="AMARED" class="brandLogo" />
      <div>
        <div class="brandTitle">AMARED</div>
        <div class="muted small">Gestión de perfiles</div>
      </div>
    </div>
    <a class="btn secondary" href="kitchen.html">Volver a cocina</a>
  </header>

  <!-- Loading overlay (igual idea que ya manejas) -->
  <div id="loading" class="loadingOverlay" style="display:none;">
    <div class="loadingCard">
      <div class="loadingTitle" id="loadingTitle">Cargando…</div>
      <div class="muted small" id="loadingMsg">Procesando</div>
    </div>
  </div>

  <main class="container">
    <!-- Gate / Login -->
    <section class="card">
      <h2>Acceso</h2>
      <p class="muted small">Ingresa la clave para administrar perfiles.</p>

      <div class="field">
        <label>Clave de perfiles</label>
        <input id="inpSecret" type="password" placeholder="Clave" autocomplete="current-password" />
      </div>

      <div class="rowBetween" style="margin-top:12px;">
        <button id="btnUnlock" class="btn primary" type="button">Ingresar</button>
        <button id="btnLock" class="btn secondary" type="button">Bloquear</button>
      </div>

      <div id="gateErr" class="muted small" style="margin-top:10px; color:#b00020;"></div>
    </section>

    <!-- Manager -->
    <section class="card" id="mgr" style="display:none;">
      <div class="rowBetween">
        <h2>Perfiles</h2>
        <div class="pill">PERFILES (Sheets)</div>
      </div>

      <div id="list" class="stack" style="margin-top:12px;"></div>

      <hr style="margin:16px 0; opacity:.2;" />

      <h3>Agregar perfil</h3>

      <div class="field">
        <label>Nombre</label>
        <input id="inpName" type="text" placeholder="Ej: Juan Pérez" />
      </div>

      <div class="field">
        <label>ID (automático)</label>
        <input id="inpId" type="text" disabled />
        <div class="muted small">Se genera desde el nombre (sin tildes, espacios → guiones bajos).</div>
      </div>

      <div class="field">
        <label>Categorías</label>
        <div class="chipGroup">
          <label class="chip"><input type="checkbox" value="kitchen" checked> Cocina</label>
          <label class="chip"><input type="checkbox" value="payments"> Pagos</label>
          <label class="chip"><input type="checkbox" value="admin"> Admin</label>
        </div>
        <div class="muted small">Un perfil puede estar en varias categorías.</div>
      </div>

      <button id="btnAdd" class="btn primary" type="button">Agregar</button>
      <div id="mgrErr" class="muted small" style="margin-top:10px; color:#b00020;"></div>
    </section>
  </main>

  <script src="profiles.js"></script>
</body>
</html>
